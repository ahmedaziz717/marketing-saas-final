name: Domain routing source snapshot
on:
  push:
    branches: [codex/evokeloop-domain-routing]
    paths: [.github/workflows/domain-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/domain-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: domain-source
          path: /tmp/domain-source.tgz
          retention-days: 1
