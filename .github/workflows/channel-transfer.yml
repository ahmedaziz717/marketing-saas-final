name: Apply verified channel source checkpoint
on:
  push:
    branches: [codex/facebook-publishing-analytics]
    paths: [.github/workflows/channel-transfer.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/facebook-publishing-analytics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "623d7568b2d70934da3ec79489c30b23fe240c33"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import bz2, hashlib, pathlib, subprocess
          packed = b''.join(pathlib.Path(f'.channel-transfer/part-{i:02d}.bin').read_bytes() for i in range(11))
          assert len(packed) == 65393
          assert hashlib.sha256(packed).hexdigest() == '234dbbc21a734e330e6af63dbc9c0a8a34a70f22c0d217688f7e071da41f7182'
          patch = bz2.decompress(packed)
          assert len(patch) == 463274
          path = '/tmp/frame-channel-changes.patch'
          pathlib.Path(path).write_bytes(patch)
          expected = set('''
          .env.example
          .github/workflows/channel-workspace.yml
          .github/workflows/creative-builder.yml
          .gitignore
          client/src/App.tsx
          client/src/components/AssetWorkbench.tsx
          client/src/components/ChannelConnections.tsx
          client/src/components/DashboardLayout.tsx
          client/src/components/PublicationComposer.tsx
          client/src/components/PublishingCalendar.tsx
          client/src/pages/AdvertisingPage.tsx
          client/src/pages/AnalyticsPage.tsx
          client/src/pages/IntegrationsPage.test.tsx
          client/src/pages/IntegrationsPage.tsx
          client/src/pages/LegacyPublishingPage.tsx
          client/src/pages/PublishingPage.tsx
          client/src/pages/SocialMediaPage.tsx
          docs/facebook-publishing-analytics.md
          drizzle.postgres.config.ts
          drizzle/channelSchema.ts
          drizzle/postgres/0002_dark_iron_patriot.sql
          drizzle/postgres/meta/0002_snapshot.json
          drizzle/postgres/meta/_journal.json
          scripts/check-channel-layout.mjs
          scripts/fixtures/channel-workspace-stubs.tsx
          scripts/fixtures/channel-workspace.tsx
          server/_core/index.ts
          server/channelOAuth.test.ts
          server/channelWorkflow.test.ts
          server/channels.test.ts
          server/lib/channelConnections.ts
          server/lib/channelGraph.ts
          server/lib/channelReports.ts
          server/lib/publications.ts
          server/migration.bootstrap.test.ts
          server/routers.ts
          server/routers/channels.ts
          server/worker.ts
          shared/channels.ts
          '''.split())
          actual = {line.split('\t', 2)[2] for line in subprocess.check_output(['git', 'apply', '--numstat', path], text=True).splitlines()}
          assert actual == expected, (actual - expected, expected - actual)
          print('Verified source patch checksum and exact path allowlist')
          PY
          git apply --check /tmp/frame-channel-changes.patch
          git apply --index /tmp/frame-channel-changes.patch
          git rm -r .channel-transfer
          git rm .github/workflows/channel-transfer.yml
          test "$(git write-tree)" = "bfaf4c4964670199c1216b18ab3262169c55e9bd"
          echo 'Verified exact locally tested final source tree bfaf4c4964670199c1216b18ab3262169c55e9bd'
          # The connected GitHub action will finalize workflow changes separately.
          # This temporary job only pushes application source to the feature branch.
          git restore --source=HEAD --staged --worktree -- .github/workflows/creative-builder.yml .github/workflows/channel-workspace.yml .github/workflows/channel-transfer.yml
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Implement Facebook workspaces, shared publishing and channel analytics"
          git push origin HEAD:refs/heads/codex/facebook-publishing-analytics
