name: Prepare navigation source snapshot
on:
  push:
    branches: [codex/collapsible-channel-navigation]
    paths: [.github/workflows/navigation-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive HEAD -o /tmp/frame-navigation-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: frame-navigation-source
          path: /tmp/frame-navigation-source.tar
          retention-days: 1
