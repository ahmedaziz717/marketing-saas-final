name: Migration and Creative Builder checks
on:
  pull_request:
  push:
    branches: [main, codex/render-supabase-migration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-test-password
          POSTGRES_DB: creative_builder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d creative_builder_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:ephemeral-test-password@127.0.0.1:5432/creative_builder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/smoke-build.mjs
