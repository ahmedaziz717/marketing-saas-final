name: Apply verified Frame product source
on:
  push:
    branches: [codex/frame-product-structure-billing]
    paths: [.github/workflows/product-transfer.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/frame-product-structure-billing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply locally tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "37cab6e44f24353c2cfdda4dc565c6adfb0dfa01"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import bz2, hashlib, pathlib, subprocess
          packed = b''.join(pathlib.Path(f'.product-transfer/part-{i:02d}.bin').read_bytes() for i in range(5))
          assert len(packed) == 26344
          assert hashlib.sha256(packed).hexdigest() == '5861fed8ae50c389e51b2c911a69d51807e169f4bf35fd191c23e3149e0e17aa'
          patch = bz2.decompress(packed)
          assert len(patch) == 129263
          path = '/tmp/frame-product-changes.patch'
          pathlib.Path(path).write_bytes(patch)
          expected = set('''
          .github/workflows/product-workspace.yml
          client/src/App.tsx
          client/src/components/AssetWorkbench.tsx
          client/src/components/BillingUsage.test.tsx
          client/src/components/BillingUsage.tsx
          client/src/components/WorkspaceNavigation.test.tsx
          client/src/components/WorkspaceNavigation.tsx
          client/src/pages/CreativesPage.tsx
          client/src/pages/PlannedFeaturePage.tsx
          client/src/pages/ProductOverviewPage.tsx
          client/src/pages/SettingsPage.test.tsx
          client/src/pages/SettingsPage.tsx
          client/src/pages/WorkspaceApp.tsx
          docs/frame-product-billing.md
          scripts/check-channel-layout.mjs
          scripts/fixtures/channel-workspace.tsx
          server/billing.test.ts
          server/frameProduct.test.ts
          server/routers.ts
          server/routers/billing.ts
          shared/frameProduct.ts
          '''.split())
          actual = {line.split('\t', 2)[2] for line in subprocess.check_output(['git', 'apply', '--numstat', path], text=True).splitlines()}
          assert actual == expected, (actual - expected, expected - actual)
          print('Verified patch checksum and exact file allowlist')
          PY
          git apply --check /tmp/frame-product-changes.patch
          git apply --index /tmp/frame-product-changes.patch
          git rm -r .product-transfer
          git rm .github/workflows/product-transfer.yml
          test "$(git write-tree)" = "f5b6e8665c2661781b75a211253a160e5cfbb564"
          echo 'Verified exact locally tested source tree f5b6e8665c2661781b75a211253a160e5cfbb564'
          # The connected GitHub action removes temporary workflows separately.
          git restore --source=HEAD --staged --worktree -- .github/workflows/product-workspace.yml .github/workflows/product-transfer.yml
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Organize Frame around Create Activate Measure Optimize and add billing preview"
          git push origin HEAD:refs/heads/codex/frame-product-structure-billing
