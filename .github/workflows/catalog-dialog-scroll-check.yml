name: Catalog dialog focused verification
on:
  push:
    branches: [codex/catalog-dialog-scroll-check]
    paths: [.github/workflows/catalog-dialog-scroll-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep native fieldset disabling inside the scroll area
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/catalog-dialog-scroll-check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/src/components/ApiCatalogConnect.tsx')
          s = p.read_text()
          def change(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          change('<fieldset disabled={busy} className="flex min-h-0 min-w-0 flex-1 flex-col">', '<div aria-busy={busy} className="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">')
          change('className="min-h-0 overflow-y-auto px-5 py-4 space-y-4"', 'className="min-h-0 flex-1 overflow-y-auto px-5 py-4"')
          change('        <p className="text-sm text-muted-foreground">\n          1. Add your source', '        <fieldset disabled={busy} className="min-w-0 space-y-4">\n        <p className="text-sm text-muted-foreground">\n          1. Add your source')
          change('      </div>\n      <DialogActionFooter', '        </fieldset>\n      </div>\n      <DialogActionFooter')
          change('    </fieldset>\n  );\n}', '    </div>\n  );\n}')
          change('key={i.index}', 'key={`${i.field}-${i.index ?? i.product}`}')
          p.write_text(s)
          p = Path('scripts/fixtures/channel-workspace.tsx')
          s = p.read_text()
          change('        imageInput.value === "https://cdn.example/clx/",', '''        // Re-preview replaces the optional-details panel; inspect the new input.
                  Array.from(dialog.querySelectorAll<HTMLLabelElement>("label"))
                    .find(label => label.textContent?.includes("Website address where product images"))
                    ?.querySelector<HTMLInputElement>("input")?.value === "https://cdn.example/clx/",''')
          p.write_text(s)
          PY
          rm .github/workflows/catalog-dialog-scroll-check.yml
      - run: corepack enable && pnpm install --frozen-lockfile --prod=false
      - run: pnpm exec prettier --write client/src/components/ApiCatalogConnect.tsx scripts/fixtures/channel-workspace.tsx
      - run: pnpm check
      - run: pnpm exec vitest run client/src/components/ApiCatalogConnect.test.tsx client/src/components/DialogActionFooter.test.tsx
      - run: pnpm build
      - name: Check fixed actions and warnings at all supported task viewports
        run: LAYOUT_PAGES=catalog-api-import,studio-ad-warning,studio-ad-create node scripts/check-channel-layout.mjs
      - name: Record verified code on isolated branch only
        run: |
          git add client/src/components/ApiCatalogConnect.tsx scripts/fixtures/channel-workspace.tsx .github/workflows/catalog-dialog-scroll-check.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep catalog actions visible and inspect refreshed preview controls'
          git push origin HEAD:refs/heads/codex/catalog-dialog-scroll-check
          git log -1 --format='commit=%H tree=%T'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-dialog-focused
          path: artifacts/channel-layout/
          retention-days: 2
