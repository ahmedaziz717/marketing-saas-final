name: Prepare isolated channel workspace
on:
  push:
    branches: [codex/facebook-publishing-analytics]
    paths: [.github/workflows/channel-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && NODE_ENV=production pnpm install --frozen-lockfile --prod=false
      - name: Package tracked source and locked dependencies only
        run: |
          mkdir -p /tmp/frame-test-workspace
          git archive HEAD | tar -xf - -C /tmp/frame-test-workspace
          cp -a node_modules /tmp/frame-test-workspace/
          tar -czf /tmp/frame-test-workspace.tgz -C /tmp/frame-test-workspace .
      - uses: actions/upload-artifact@v4
        with:
          name: frame-test-workspace
          path: /tmp/frame-test-workspace.tgz
          retention-days: 1
          compression-level: 0
