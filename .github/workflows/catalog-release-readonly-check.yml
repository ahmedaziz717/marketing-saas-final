name: Catalog release read-only checks
on:
  push:
    branches: [codex/catalog-release-readonly-check]
    paths: [.github/workflows/catalog-release-readonly-check.yml]
permissions:
  contents: read
jobs:
  verify-live-release:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EXPECTED_RELEASE_SHA: c74cc07da3dee7c563c678ca5e5bfec31471ae17
      VERIFY_STAGE: web-before-worker
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public health and released assets without account access
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {setTimeout as wait} from 'node:timers/promises';
          const origins=['https://app.evokeloop.com','https://frame-staging.onrender.com'];
          async function get(url) {
            for(let redirect=0;redirect<4;redirect++) {
              assert(origins.includes(new URL(url).origin),'Unexpected redirect origin');
              const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(15000),redirect:'manual'});
              if([301,302,303,307,308].includes(response.status)) {
                assert(response.headers.get('location'),'Missing redirect location');
                url=new URL(response.headers.get('location'),url).href;
                continue;
              }
              assert.equal(response.status,200,`HTTP health/asset check failed: ${url}`);
              return response;
            }
            throw new Error('Unexpected redirect loop');
          }
          for (const origin of origins) {
            let health;
            for (let attempt=0;attempt<18;attempt++) {
              try {
                health=await (await get(`${origin}/healthz`)).json();
                if(health.ok===true && health.commit===process.env.EXPECTED_RELEASE_SHA) break;
              } catch { /* Public deployment may still be becoming healthy. */ }
              if(attempt===17) throw new Error(`Expected healthy release not available: ${origin}`);
              await wait(5000);
            }
            assert.equal(health.ok,true);
            assert.equal(health.commit,process.env.EXPECTED_RELEASE_SHA);
            const html=await (await get(`${origin}/login`)).text();
            const assets=['/assets/index-CPmgwZme.js','/assets/index-CifhTMQx.css'];
            const verified=[];
            for (const path of assets) {
              assert(html.includes(path),`Login page does not reference the verified asset: ${path}`);
              const text=await (await get(`${origin}${path}`)).text();
              if(path.endsWith('.js')) {
                assert(text.includes('products can be imported for review'));
                assert(text.includes('data-dialog-actions'));
              }
              verified.push({path,sha256:createHash('sha256').update(text).digest('hex')});
            }
            console.log(JSON.stringify({stage:process.env.VERIFY_STAGE,origin,http:200,ok:health.ok,commit:health.commit,assets:verified,checkedAt:new Date().toISOString()}));
          }
          JS
