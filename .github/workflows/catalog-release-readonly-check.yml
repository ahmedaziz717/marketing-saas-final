name: Catalog release read-only checks
on:
  push:
    branches: [codex/catalog-release-readonly-check]
    paths: [.github/workflows/catalog-release-readonly-check.yml]
permissions:
  contents: read
jobs:
  verify-public-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c0f6f90c6557db283098922e4150612dd3c8f8c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile --prod=false
      - name: Preview the public product feed with the corrected directory rule
        shell: bash
        run: |
          cat > .catalog-feed-check.ts <<'TS'
          import assert from 'node:assert/strict';
          import {apiCatalogConfigSchema} from './shared/apiCatalog';
          import {fetchApiCatalog,parseApiCatalog} from './server/lib/apiCatalog';
          import {safeFetchImage} from './server/lib/websiteCrawler';
          async function main() {
            const endpoint='https://api.cybertron.com/v1/products/kits?pagination=false';
            const config=apiCatalogConfigSchema.parse({imageBaseUrl:'https://static.cybertron.com/clx',defaultCurrency:'USD'});
            assert.equal(config.imageBaseUrl,'https://static.cybertron.com/clx/');
            const data=await fetchApiCatalog(endpoint,config);
            const result=parseApiCatalog(data,endpoint,config,{preview:true});
            assert(result.items.length>0);
            assert.equal(new Set(result.items.map(p=>p.externalId)).size,result.items.length);
            assert(!result.issues.some(i=>i.blocking));
            let imagesVerified=0;
            for (const item of result.items.filter(p=>p.imageUrl).slice(0,3)) {
              assert(item.imageUrl.startsWith('https://static.cybertron.com/clx/'));
              try { await safeFetchImage(item.imageUrl); imagesVerified++; }
              catch { console.log(JSON.stringify({sku:item.sku,image:'unavailable; import remains reviewable'})); }
            }
            console.log(JSON.stringify({check:'actual Cybertron feed',products:result.items.length,stableIdentities:result.items.length,missingProductLinks:result.items.filter(p=>!p.productUrl).length,productsWithSpecifications:result.items.filter(p=>Object.keys(p.specifications).length).length,imagesVerified,imageBase:config.imageBaseUrl,blockingIssues:result.issues.filter(i=>i.blocking).length,mode:'read only; no database import, paid generation, or advertising actions'}));
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          TS
          pnpm exec tsx .catalog-feed-check.ts
