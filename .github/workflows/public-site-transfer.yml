name: Apply verified public website source
on:
  push:
    branches: [codex/frame-public-website]
    paths: [.github/workflows/public-site-transfer.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/frame-public-website'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply locally tested public website source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4cfd33cdc59294e7c563630c16bf86eaed11ab34"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import bz2, hashlib, pathlib, subprocess
          packed = b''.join(pathlib.Path(f'.public-site-transfer/part-{i:02d}.bin').read_bytes() for i in range(8))
          assert len(packed) == 50310
          assert hashlib.sha256(packed).hexdigest() == 'dbad2162017bae36b499d4b9ca64fb782147de9ea586e9290e75abae6bc266a9'
          patch = bz2.decompress(packed)
          assert len(patch) == 308399
          path = '/tmp/frame-public.patch'
          pathlib.Path(path).write_bytes(patch)
          expected = set('''
          .github/workflows/creative-builder.yml
          .github/workflows/public-site-source.yml
          client/index.html
          client/public/website/favicon.svg
          client/public/website/site.css
          client/src/App.tsx
          client/src/pages/Home.tsx
          client/src/pages/PlatformWebsitePage.test.tsx
          client/src/pages/PlatformWebsitePage.tsx
          client/src/pages/SettingsPage.test.tsx
          client/src/pages/SettingsPage.tsx
          docs/public-website-meta-readiness.md
          drizzle.postgres.config.ts
          drizzle/postgres/0003_lazy_dexter_bennett.sql
          drizzle/postgres/meta/0003_snapshot.json
          drizzle/postgres/meta/_journal.json
          drizzle/websiteSchema.ts
          scripts/check-public-website.mjs
          server/_core/index.ts
          server/lib/publicWebsite.ts
          server/migration.bootstrap.test.ts
          server/public/Website.tsx
          server/public/content.ts
          server/public/routes.tsx
          server/publicWebsite.test.ts
          server/routers.ts
          server/routers/publicWebsite.ts
          shared/publicWebsite.ts
          '''.split())
          actual = {line.split('\t', 2)[2] for line in subprocess.check_output(['git', 'apply', '--numstat', path], text=True).splitlines()}
          assert actual == expected, (actual - expected, expected - actual)
          print('Verified source checksum and exact path allowlist')
          PY
          git apply --check /tmp/frame-public.patch
          git apply --index /tmp/frame-public.patch
          git rm -r .public-site-transfer
          git rm .github/workflows/public-site-transfer.yml
          test "$(git write-tree)" = "4b4064f71715c02b0c4b23105ad36cdf0c3de4ce"
          echo 'Verified exact locally tested source tree'
          # The connector finalizes workflow changes separately.
          git restore --source=HEAD --staged --worktree -- .github/workflows/creative-builder.yml .github/workflows/public-site-source.yml .github/workflows/public-site-transfer.yml
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Overhaul Frame public website, trust pages and private request inbox"
          git push origin HEAD:refs/heads/codex/frame-public-website
