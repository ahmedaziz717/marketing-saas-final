name: Apply verified navigation patch
on:
  push:
    branches: [codex/collapsible-channel-navigation]
    paths: [.github/workflows/navigation-transfer.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/collapsible-channel-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply locally tested navigation source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b4ed27d91259fc5f3aef98fe624b1e6b425e1898"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import bz2, hashlib, pathlib, subprocess
          packed = b''.join(pathlib.Path(f'.navigation-transfer/part-{i:02d}.bin').read_bytes() for i in range(3))
          assert len(packed) == 15597
          assert hashlib.sha256(packed).hexdigest() == '9a1a71d4dbe3aee1feaf85117b3674e09513d31c70f11afde8903b974d472712'
          patch = bz2.decompress(packed)
          assert len(patch) == 71534
          path = '/tmp/frame-navigation.patch'
          pathlib.Path(path).write_bytes(patch)
          expected = set('''
          .github/workflows/navigation-workspace.yml
          client/src/App.tsx
          client/src/components/DashboardLayout.tsx
          client/src/components/WorkspaceNavigation.test.tsx
          client/src/components/WorkspaceNavigation.tsx
          client/src/lib/analyticsNavigation.ts
          client/src/pages/AdvertisingPage.tsx
          client/src/pages/AnalyticsNavigation.test.tsx
          client/src/pages/AnalyticsPage.tsx
          client/src/pages/SocialMediaPage.tsx
          docs/collapsible-channel-navigation.md
          scripts/check-channel-layout.mjs
          scripts/fixtures/channel-workspace-stubs.tsx
          scripts/fixtures/channel-workspace.tsx
          '''.split())
          actual = {line.split('\t', 2)[2] for line in subprocess.check_output(['git', 'apply', '--numstat', path], text=True).splitlines()}
          assert actual == expected, (actual - expected, expected - actual)
          print('Verified navigation patch checksum and exact source path allowlist')
          PY
          git apply --check /tmp/frame-navigation.patch
          git apply --index /tmp/frame-navigation.patch
          git rm -r .navigation-transfer
          git rm .github/workflows/navigation-transfer.yml
          test "$(git write-tree)" = "2bb85e6da2dfcb7997468076905710678fb0de70"
          echo 'Verified exact locally tested navigation source tree'
          # Workflow file removals are finalized separately through the connector.
          git restore --source=HEAD --staged --worktree -- .github/workflows/navigation-workspace.yml .github/workflows/navigation-transfer.yml
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Move channels and Analytics views into collapsible sidebar navigation"
          git push origin HEAD:refs/heads/codex/collapsible-channel-navigation
