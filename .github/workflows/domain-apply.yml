name: Apply verified domain routing source
on:
  push:
    branches: [codex/evokeloop-domain-routing]
    paths: [.github/workflows/domain-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          test "$(git rev-parse HEAD^)" = "ea4c3c242e56c4f0850c6c9c2a90f0c0d9bc30f5"
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib,subprocess
          packed=''
          patch=zlib.decompress(base64.b64decode(packed))
          assert hashlib.sha256(patch).hexdigest()=='15c5a6a7e3eb9fc25bd425612f7f0ffaead962d599424d51e2b217d72fe6a3bc'
          pathlib.Path('/tmp/domain.patch').write_bytes(patch)
          paths={line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat','/tmp/domain.patch'],text=True).splitlines()}
          assert paths==set('.env.example docs/evokeloop-domain-cutover.md server/_core/index.ts server/auth/routes.ts server/lib/siteOrigins.ts server/lib/siteRouting.ts server/public/Website.tsx server/public/routes.tsx server/siteRouting.test.ts'.split())
          subprocess.run(['git','apply','--index','/tmp/domain.patch'],check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare isolated website and app domains with safe redirects'
          git push origin HEAD:refs/heads/codex/evokeloop-domain-routing
