name: Read-only live EvokeLoop verification
on:
  push:
    branches: [codex/evokeloop-brand-experience]
    paths: [.github/workflows/evokeloop-live-check.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/evokeloop-brand-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read deployed HTML, CSS, SVG and dashboard build only
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const origin='https://frame-staging.onrender.com';
          const get = async (url) => {
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,url);
            return {r,text:await r.text()};
          };
          const paths=['/','/product','/product/create','/product/activate','/product/measure','/product/optimize','/integrations','/pricing','/about','/contact','/privacy','/terms','/data-deletion','/security'];
          for(const path of paths){
            const {r,text}=await get(origin+path);
            assert.match(r.headers.get('content-type')||'',/text\/html/);
            assert.match(text,/<h1/);
            assert.match(text,/EvokeLoop/);
            assert.doesNotMatch(text,/\bFrame\b/);
            assert.match(text,/evokeloop-wordmark/);
            assert.match(text,/website\/brand\.css/);
            assert.match(text,/family=Manrope/);
            assert.ok(r.headers.get('content-security-policy')?.includes('fonts.googleapis.com'));
            assert.equal(r.headers.get('set-cookie'),null);
            if(path==='/'){
              assert.match(text,/loop-orbit/);
              assert.match(text,/Pause loop motion/);
              assert.match(text,/Repeat/);
            }
            console.log('PASS live public page:',path);
          }
          const master=await get(origin+'/website/evokeloop-wordmark.svg');
          assert.equal(createHash('sha256').update(master.text).digest('hex'),'5d1287ee6c10c0e0fd8751501503baed86bd967176064961bf09ee3908a2e32e');
          for(const name of ['evokeloop-wordmark-reversed.svg','evokeloop-symbol.svg','favicon.svg']){
            assert.match((await get(origin+'/website/'+name)).text,/<svg/);
          }
          const brand=await get(origin+'/website/brand.css');
          assert.match(brand.text,/prefers-reduced-motion/);
          assert.match(brand.text,/animation-play-state: paused/);
          assert.match((await get(origin+'/website/site.css')).text,/evoke-hero/);
          const login=await get(origin+'/login');
          assert.match(login.text,/EvokeLoop \| Your marketing workspace/);
          const script=login.text.match(/<script[^>]*src="([^"]+)"/);
          assert.ok(script,'Dashboard production bundle reference');
          const bundle=await get(new URL(script[1],origin).href);
          assert.match(bundle.text,/evokeloop-wordmark/);
          for(const path of ['/signup','/reset-password','/app','/healthz','/sitemap.xml','/robots.txt']) await get(origin+path);
          for(const host of ['evokeloop.com','app.evokeloop.com','www.evokeloop.com']){
            const result=await get('https://'+host+'/');
            assert.match(result.text,/EvokeLoop/);
            console.log('PASS custom-host HTTPS and public content:',host);
            if(host==='www.evokeloop.com')assert.equal(new URL(result.r.url).hostname,'evokeloop.com');
          }
          console.log('PASS read-only live verification: public content, exact SVG master, CSS, app build, health and HTTPS aliases.');
          console.log('NOT tested or activated: authenticated customer flows on custom domains, form submissions, emails, publishing, billing or Supabase URL configuration.');
          JS
